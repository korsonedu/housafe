[project]
name = "housafe-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "channels>=4.0",
  "channels-redis>=4.2",
  "daphne>=4.1",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "dj-database-url>=2.1",
  "python-dotenv>=1.0",
  "housafe-contracts",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8", "pytest-asyncio>=0.23"]
